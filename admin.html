<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 500px;
        margin: 20px auto;
        padding: 0 16px;
      }
      input,
      button {
        padding: 10px;
        margin: 6px 0;
        font-size: 16px;
      }
      #qr {
        margin: 16px 0;
      }
    </style>
  </head>
  <body>
    <h2>Class session</h2>
    <input id="class_name" placeholder="Class name" />
    <button id="start">Start session</button>
    <div id="qr"></div>
    <h3>Present: <span id="count">0</span></h3>
    <ul id="list"></ul>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="js/config.js"></script>
    <script>
      let sessionId = null;
      let timer = null;

      document.getElementById("start").onclick = async () => {
        const { data, error } = await db
          .from("sessions")
          .insert({ class_name: document.getElementById("class_name").value })
          .select()
          .single();
        if (error) return alert("Error: " + error.message);
        sessionId = data.id;
        const url = new URL("index.html?s=" + sessionId, location.href).href;
        document.getElementById("qr").innerHTML = "";
        new QRCode(document.getElementById("qr"), {
          text: url,
          width: 220,
          height: 220,
        });
        refresh();
        clearInterval(timer);
        timer = setInterval(refresh, 4000);
      };

      async function refresh() {
        const { data } = await db
          .from("attendance")
          .select("marked_at, students(full_name, id_number)")
          .eq("session_id", sessionId);
        if (!data) return;
        document.getElementById("count").textContent = data.length;
        document.getElementById("list").innerHTML = data
          .map(
            (r) =>
              `<li>${r.students.full_name} (${r.students.id_number}), ${new Date(r.marked_at).toLocaleTimeString()}</li>`,
          )
          .join("");
      }
    </script>
  </body>
</html>
